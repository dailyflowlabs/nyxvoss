alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
domains:
- domain: nyxvoss.com
  type: PRIMARY
  zone: nyxvoss.com
- domain: www.nyxvoss.com
  type: ALIAS
  zone: nyxvoss.com
features:
- buildpack-stack=ubuntu-22
ingress:
  rules:
  - component:
      name: nyxvoss
    match:
      path:
        prefix: /
name: nyxvoss
region: nyc
services:
- build_command: npm install
  environment_slug: node-js
  github:
    branch: main
    deploy_on_push: true
    repo: dailyflowlabs/nyxvoss
  http_port: 3000
  instance_count: 1
  instance_size_slug: apps-s-1vcpu-0.5gb
  name: nyxvoss
  run_command: npm run start
  source_dir: /
